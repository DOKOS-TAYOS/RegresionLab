name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt
          sphinx-docs/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip check
    - name: Lint with ruff
      run: |
        python -m ruff check .
    - name: Check formatting with ruff
      run: |
        python -m ruff format . --check
    - name: Test with pytest
      run: |
        python -m pytest

  required-pr-ci:
    name: ${{ github.event_name == 'pull_request' && 'required-pr-ci' || 'push-ci-summary' }}
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Required job build finished with '${BUILD_RESULT}', expected success."
            exit 1
          fi

          echo "All required jobs passed."
